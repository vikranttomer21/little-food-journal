
name: Website Availability Check

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Verify website URL
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "ERROR: APP_URL is missing."
            echo "Go to Settings > Secrets and variables > Actions > Variables."
            echo "Create a repository variable named APP_URL."
            exit 1
          fi

          case "$APP_URL" in
            https://*) echo "Website URL is configured." ;;
            *)
              echo "ERROR: APP_URL must start with https://"
              exit 1
              ;;
          esac

      - name: Ping Streamlit app
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: python ping_app.py
