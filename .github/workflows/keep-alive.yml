
name: Website Availability Check

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Ping Streamlit app
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: python ping_app.py
